<!doctype html>
<html lang="en" data-theme="mist">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillLedger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Inter:wght@400;500;600&family=Hind+Siliguri:wght@400;500;600;700&display=swap">
<style>
/* SkillLedger v1 (Phase 1). Single file. (c) 2026 SULTANA ISRAT JAHAN. All rights reserved. */
:root,[data-theme="mist"]{--bg:#F3F6F5;--card:#fff;--ink:#12302F;--muted:#4A6361;--line:#D5E0DD;--line2:#E4ECEA;--head:#0F3D3E;--headink:#fff;--headmuted:#CFE3E0;--brand:#0E6E6B;--onbrand:#fff;--accent:#F2A93B;--soft:#EAF1EF;--field:#9DB3AF;--focus:#1B4FA8;
--up-bg:#E0EAFB;--up-fg:#1B4FA8;--ok-bg:#DDF1E6;--ok-fg:#146B42;--pe-bg:#FBEBCB;--pe-fg:#7A4E0B;--lo-bg:#F8DDD8;--lo-fg:#9B2C1B;--lowrow:#FDF3F1;--c1:#0E6E6B;--c2:#F2A93B;--c3:#1B4FA8;--danger:#9B2C1B;--shadow:0 6px 18px rgba(15,61,62,.15)}
[data-theme="sand"]{--bg:#EFEAE0;--card:#FBF8F2;--ink:#2B2A24;--muted:#5A5648;--line:#D9D1BF;--line2:#E6DFCF;--head:#3A3A2E;--headink:#FFFDF6;--headmuted:#E3DDC8;--brand:#0B6360;--onbrand:#fff;--accent:#D9902B;--soft:#EAE3D2;--field:#8F8870;--focus:#1B4FA8;
--up-bg:#DCE6F7;--up-fg:#1B4FA8;--ok-bg:#D8EEDD;--ok-fg:#135C39;--pe-bg:#F6E6BE;--pe-fg:#6E4508;--lo-bg:#F5D9D2;--lo-fg:#8E2918;--lowrow:#F8ECE6;--c1:#0B6360;--c2:#D9902B;--c3:#1B4FA8;--danger:#8E2918;--shadow:0 6px 18px rgba(58,58,46,.18)}
[data-theme="dusk"]{--bg:#0E1F1F;--card:#152B2B;--ink:#E6F0EE;--muted:#A9C2BE;--line:#2C4A48;--line2:#223B3A;--head:#0A1616;--headink:#E6F0EE;--headmuted:#A9C2BE;--brand:#4CC9C2;--onbrand:#06201F;--accent:#F2B84B;--soft:#1B3636;--field:#6F8F8B;--focus:#8DB8FF;
--up-bg:#1E3558;--up-fg:#BBD3FF;--ok-bg:#16402C;--ok-fg:#9DE3BE;--pe-bg:#4A3912;--pe-fg:#F5D58C;--lo-bg:#4E2220;--lo-fg:#FFB4A8;--lowrow:#2A1E1E;--c1:#4CC9C2;--c2:#F2B84B;--c3:#8DB8FF;--danger:#FF9C8E;--shadow:0 6px 18px rgba(0,0,0,.45)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter','Hind Siliguri',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.5}
html[lang="bn"] body{font-family:'Hind Siliguri','Inter',system-ui,sans-serif;font-size:16px}
h1,h2,h3,h4{font-family:'Plus Jakarta Sans','Hind Siliguri',system-ui,sans-serif;margin:0;letter-spacing:-.01em;line-height:1.2}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
a.sr:focus{width:auto;height:auto;clip:auto;background:var(--card);color:var(--ink);padding:10px 14px;z-index:100;left:8px;top:8px;border-radius:8px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.wrap{max-width:1280px;margin:0 auto;padding:0 clamp(14px,3vw,32px)}
.muted{color:var(--muted)}.small{font-size:13px}.xs{font-size:12px}
.lbl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.pad{padding:clamp(14px,2vw,20px)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:16px}
.g-auto{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.g-chart{grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr))}
/* header */
.top{background:var(--head);color:var(--headink);position:sticky;top:0;z-index:30}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:58px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.brand{display:flex;align-items:center;gap:10px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:18px;color:var(--headink);text-decoration:none}
.nav{display:flex;gap:2px;flex:1;flex-wrap:wrap}
.nav a{padding:8px 12px;border-radius:8px;color:var(--headink);text-decoration:none;font-weight:500;font-size:14px;min-height:40px;display:flex;align-items:center}
.nav a:hover{background:rgba(255,255,255,.1)}
.top .wrap{flex-wrap:nowrap;gap:12px;min-height:62px}
.nav{flex-wrap:nowrap;align-items:center;gap:2px}
.nav>a,.moreb{white-space:nowrap}
.brand{flex:none}
.more{position:relative}
.moreb{background:transparent;border:0;color:var(--headink);font:inherit;font-weight:500;font-size:14px;padding:8px 12px;min-height:40px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:4px}
.moreb:hover,.more.on .moreb,.moreb.cur{background:rgba(255,255,255,.14)}
.more .menu{display:none;position:absolute;left:0;top:calc(100% + 6px);min-width:210px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:40;flex-direction:column}
.more.on .menu{display:flex}
.more .menu a{color:var(--ink);padding:10px 12px;border-radius:8px;min-height:40px}
.more .menu a:hover{background:var(--line2)}
.more .menu a[aria-current="page"]{background:var(--line2);font-weight:700}
.topsel{flex:none}
.chip-user{flex:none;display:flex;align-items:center;gap:8px;padding:4px 6px 4px 4px;border-radius:999px;background:rgba(255,255,255,.1)}
.chip-user .linkbtn{color:var(--headink);opacity:.85;font-size:13px;padding:4px 8px;text-decoration:none;border-left:1px solid rgba(255,255,255,.25);border-radius:0;min-height:0}
details.accd{border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
details.accd>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;font-weight:700;font-size:16px;min-height:52px}
details.accd>summary::-webkit-details-marker{display:none}
details.accd>summary::after{content:"▾";margin-left:auto;transition:transform .15s;color:var(--muted)}
details.accd[open]>summary::after{transform:rotate(180deg)}
details.accd>summary>span:first-child{flex:0 1 auto}
details.accd[open]>summary{border-bottom:1px solid var(--line2)}
.accb{padding:16px;gap:12px}
@media (max-width:1180px){.nav>a,.moreb{padding:8px 9px;font-size:13.5px}.top .wrap{gap:8px}}

.nav a[aria-current="page"]{background:rgba(255,255,255,.18);font-weight:600}
.burger{display:none;background:transparent;border:1.5px solid var(--headmuted);color:var(--headink);border-radius:8px;min-height:40px;min-width:44px;font-size:18px;cursor:pointer}
.topsel{background:var(--card);color:var(--ink);border:1.5px solid var(--headmuted);border-radius:8px;padding:6px 8px;min-height:40px}
.chip-user{display:flex;align-items:center;gap:8px;font-size:13px}
.av{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#12302F;font-weight:700;display:flex;align-items:center;justify-content:center}
.linkbtn{background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;padding:6px;min-height:36px}
/* buttons and fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:8px;border:1.5px solid var(--brand);background:var(--brand);color:var(--onbrand);font-weight:600;font-size:14px;min-height:44px;cursor:pointer;text-decoration:none}
.btn:hover{filter:brightness(1.07)}
.btn.sec{background:var(--card);color:var(--brand)}
.btn.dng{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.sm{min-height:36px;padding:5px 12px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>label,.fld>.fl{font-weight:600;font-size:14px}
.req{color:var(--danger)}
.inp,select.inp,textarea.inp{width:100%;border:1.5px solid var(--field);border-radius:8px;padding:9px 12px;background:var(--card);min-height:44px}
textarea.inp{min-height:84px;resize:vertical}
.inp:focus{border-color:var(--brand)}
.inp[aria-invalid="true"]{border-color:var(--danger);background:var(--lowrow)}
.err{color:var(--danger);font-size:13px;font-weight:600;display:none}
.err.on{display:block}
.hint{color:var(--muted);font-size:13px}
.seg{display:flex;gap:10px;flex-wrap:wrap}
.opt{display:flex;align-items:center;gap:8px;border:1.5px solid var(--field);border-radius:8px;padding:8px 14px;min-height:44px;cursor:pointer;background:var(--card)}
.opt:has(input:checked){border-color:var(--brand);background:var(--soft);font-weight:600}
.opt input{accent-color:var(--brand);width:18px;height:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipx{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1.5px solid var(--field);background:var(--card);font-size:13px;font-weight:600;cursor:pointer;min-height:36px}
.chipx:has(input:checked),.chipx.on{background:var(--brand);color:var(--onbrand);border-color:var(--brand)}
.chipx input{position:absolute;opacity:0;pointer-events:none}
.chipx:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
/* pills */
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.p-up{background:var(--up-bg);color:var(--up-fg)}.p-ok{background:var(--ok-bg);color:var(--ok-fg)}.p-pe{background:var(--pe-bg);color:var(--pe-fg)}.p-lo{background:var(--lo-bg);color:var(--lo-fg)}.p-soft{background:var(--soft);color:var(--ink)}
/* tables */
.tw{overflow-x:auto;border-radius:12px}
table{border-collapse:collapse;width:100%}
th{text-align:left;font-size:12px;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);background:var(--soft);white-space:nowrap;position:sticky;top:0}
th button{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center;font-weight:600;padding:2px 0}
th button:focus-visible{outline:3px solid var(--focus)}
td{padding:10px 12px;border-bottom:1px solid var(--line2);font-size:13px;vertical-align:middle;font-variant-numeric:tabular-nums}
td.r,th.r{text-align:right}
tr.low td{background:var(--lowrow)}
tr.flash td{animation:fl 2.4s ease}
@keyframes fl{0%,60%{background:var(--up-bg)}100%{background:transparent}}
.act{background:none;border:0;color:var(--brand);font-weight:600;cursor:pointer;padding:6px 8px;min-height:36px}
.act.d{color:var(--danger)}
/* hero and tiles */
.hero{background:linear-gradient(135deg,var(--head),var(--brand));color:var(--headink);border-radius:16px;padding:clamp(18px,4vw,36px);display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hero h1{font-size:clamp(24px,4vw,38px);font-weight:800}
.tile{display:flex;gap:12px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--card);text-decoration:none;color:var(--ink);min-height:72px}
.tile:hover{border-color:var(--brand)}
.tile .ic{width:44px;height:44px;border-radius:10px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.kv{font-family:'Plus Jakarta Sans',sans-serif;font-size:clamp(24px,3vw,30px);font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-radius:12px;background:var(--card);min-width:0}
.ins{padding:10px 14px;background:var(--card);border-radius:8px;border:1px solid var(--line);border-left:4px solid var(--accent);font-size:14px}
.item{padding:14px 0;border-top:1px solid var(--line2);display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.item:first-child{border-top:0}
.bar{display:flex;height:40px;border-radius:6px;overflow:hidden;gap:2px}
.bar button{all:unset;cursor:pointer;display:flex;align-items:center;padding:0 12px;font-weight:600;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;box-sizing:border-box}
.bar button:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}
svg text{font-family:'Inter','Hind Siliguri',sans-serif}
.svgbtn{cursor:pointer}
.svgbtn:focus-visible{outline:3px solid var(--focus)}
/* toast, modal, lumi */
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:10px;z-index:90;max-width:min(380px,calc(100vw - 32px))}
.toast{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--brand);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);animation:up .25s ease}
.toast.ok{border-left-color:#2E9E62}.toast.err{border-left-color:#D44B3C}.toast.warn{border-left-color:var(--accent)}
.toast .x{margin-left:auto;background:none;border:0;cursor:pointer;font-size:18px;color:var(--muted);min-width:32px;min-height:32px}
@keyframes up{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
#ov{position:fixed;inset:0;background:rgba(10,22,22,.55);display:none;align-items:center;justify-content:center;z-index:80;padding:16px}
#ov.on{display:flex}
.modal{background:var(--card);border-radius:14px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:22px;box-shadow:var(--shadow);border:1px solid var(--line)}
.modal.wide{max-width:760px}
/* dropdown */
.dd{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);min-width:240px;background:var(--card);border:1px solid var(--field);border-radius:10px;box-shadow:var(--shadow);z-index:40;overflow:hidden;display:none}
.menu.on{display:block}
.menu button{all:unset;display:block;width:100%;box-sizing:border-box;padding:11px 16px;cursor:pointer;font-size:14px}
.menu button:hover,.menu button:focus-visible{background:var(--soft)}
.menu hr{border:0;border-top:1px solid var(--line2);margin:0}
.pwwrap{position:relative;display:block;width:100%}.pwwrap .inp{padding-right:72px}.pweye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--link,#0F6B6D);font:inherit;font-size:13px;font-weight:600;padding:8px;min-height:36px;cursor:pointer;border-radius:8px}.pweye:focus-visible{outline:2px solid var(--link,#0F6B6D)}
.demoacc{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:8px}.demoacc button{text-align:left;border:1px solid var(--line);background:var(--card,#fff);border-radius:10px;padding:10px;font:inherit;cursor:pointer;color:inherit}.demoacc button:hover{border-color:var(--link,#0F6B6D)}
.demolock{background:var(--soft,#EEF3F2)!important;cursor:not-allowed}
.showb{background:#FFF1D6;color:#5A3B00;font-size:13px;padding:8px 0;text-align:center}
/* footer */
footer.foot{background:var(--head);color:var(--headmuted);font-size:13px;margin-top:40px}
footer.foot .wrap{padding-top:28px;padding-bottom:20px;display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between}
footer.foot a{color:var(--headmuted)}
footer.foot .copy{border-top:1px solid rgba(255,255,255,.18);text-align:center;padding:14px;color:var(--headink)}
/* manual */
.manual h2{font-size:20px;margin-top:22px}.manual h3{font-size:16px;margin-top:14px}.manual p,.manual li{max-width:78ch}
.manual .grey{opacity:.55}
.dz{border:2px dashed var(--field);border-radius:12px;padding:16px}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,var(--head),var(--brand))}
.gate .box{background:var(--card);border-radius:18px;max-width:460px;width:100%;padding:clamp(20px,4vw,32px);display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
#printRoot{display:none}
@media (max-width:1040px){
 .burger{display:inline-flex;align-items:center;justify-content:center}
 .top .wrap{flex-wrap:wrap}
 .nav{display:none;order:9;flex-basis:100%;flex-direction:column;align-items:stretch}
 .more{display:contents}.more .moreb{display:none}.more .menu{display:flex;position:static;border:0;box-shadow:none;background:transparent;padding:0}.more .menu a{color:var(--headink)}.more .menu a:hover{background:rgba(255,255,255,.1)}.more .menu a[aria-current="page"]{background:rgba(255,255,255,.18)}
 .nav.on{display:flex;max-height:calc(100vh - 76px);max-height:calc(100dvh - 76px);overflow-y:auto;-webkit-overflow-scrolling:touch}
 .top .grow{display:none}
 .top .wrap>.brand{order:1}.top .wrap>.burger{order:2;margin-left:auto}
 .top .wrap>.topsel,.top .wrap>.chip-user{display:none}
 .top .wrap>.pill{order:1}
 .navmob{display:flex;flex-direction:column;gap:10px;padding:12px 4px 4px;margin-top:6px;border-top:1px solid rgba(255,255,255,.2)}
 .navmob .topsel{width:100%;min-height:44px}
 .navwho{display:flex;align-items:center;gap:10px;color:var(--headink)}
 .navwho .linkbtn{margin-left:auto;color:var(--headink);text-decoration:underline;min-height:40px;padding:6px 10px}
}
.navmob{display:none}
@media (max-width:700px){
 table.cards,table.cards tbody,table.cards tr,table.cards td{display:block;width:100%}
 table.cards thead{display:none}
 table.cards tr{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:8px 4px;background:var(--card)}
 table.cards td{border:0;display:flex;justify-content:space-between;gap:12px;padding:5px 12px;text-align:right}
 table.cards td::before{content:attr(data-l);font-weight:600;color:var(--muted);text-align:left}
 table.cards tr.tot{display:none}
 #toasts{left:16px;right:16px;max-width:none}
}
@media print{
 body.pr-report>*:not(#printRoot),body.pr-manual>*:not(#printRoot){display:none!important}
 body.pr-report #printRoot,body.pr-manual #printRoot{display:block}
 body{background:#fff;color:#000;font-size:11pt}
 #printRoot{color:#000}
 #printRoot table{font-size:9pt}
 #printRoot th{position:static;background:#eee;color:#000}
 #printRoot h1{font-size:18pt}#printRoot h2{font-size:14pt;margin-top:14pt}
 .pbreak{page-break-before:always}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
(function(){
'use strict';
/* ===== constants ===== */
const VERSION='5.1.0';
const SHOWCASE=true;
const COPY='© 2026 SULTANA ISRAT JAHAN. All rights reserved.';
const KEY='skillledger.v1';
const LS_OK=(()=>{try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return true}catch(e){return false}})();
const ZONES=['Asia/Dhaka','Asia/Kolkata','Asia/Karachi','Asia/Dubai','Asia/Singapore','Asia/Kuala_Lumpur','Asia/Hong_Kong','Asia/Tokyo','Europe/London','Europe/Berlin','Europe/Paris','America/New_York','America/Chicago','America/Los_Angeles','Australia/Sydney','UTC'];
const CURRENCIES={BDT:'৳',USD:'$',EUR:'€',GBP:'£',INR:'₹',SGD:'S$',AED:'AED',MYR:'RM',JPY:'¥',CAD:'C$',AUD:'A$'};
const DEFAULT_COMP=['Leadership','Communication','Technical skills','Compliance','Customer service','Analytics','Coaching','Safety','Project management','Digital literacy'];
const DELIVERY=['In person','Online','Hybrid'];
const WIDGETS=[
 ['kpi_trainings','kpi'],['kpi_hours','kpi'],['kpi_people','kpi'],['kpi_cost','kpi'],['kpi_score','kpi'],['kpi_cph','kpi'],['kpi_pending','kpi'],
 ['c_month','chart'],['c_mix','chart'],['c_fac','chart'],['c_scatter','chart'],['c_low','chart']];

function calcDuration(f){

const P={q:'',dept:'',team:''};
const EMP_EX=[{name:'Ayesha Siddiqua',designation:'Training Coordinator',dept:'Human Resources',section:'Talent',team:'Learning and Development',zone:'Asia/Dhaka'},{name:'Omar Faruk',designation:'Sales Executive',dept:'Sales',section:'Retail',team:'Dhaka Retail',zone:'Asia/Dhaka'},{name:'Mei Chen',designation:'Regional Analyst',dept:'IT',section:'Systems',team:'Applications',zone:'Asia/Singapore'}];
function empStats(id){let n=0,p=0,a=0;S.trainings.forEach(r=>{const x=nomOf(r).find(y=>y.e===id);if(x){n++;if(x.st==='present')p++;if(x.st==='absent')a++}});return{n:n,p:p,a:a}}
function pplList(){const q=P.q.trim().toLowerCase();return emps().filter(e=>(!P.dept||e.dept===P.dept)&&(!P.team||e.team===P.team)&&(!q||[e.name,e.id,e.designation,e.dept,e.section,e.team].join(' ').toLowerCase().includes(q))).sort((a,b)=>a.id<b.id?-1:1)}
function vPeople(){
 const ed=canEdit();const depts=uniq(emps().map(e=>e.dept));const teams=uniq(emps().filter(e=>!P.dept||e.dept===P.dept).map(e=>e.team));

 '<div class="card pad"><div class="grid g-auto" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));align-items:end"><div class="fld" style="grid-column:span 2;min-width:min(100%,260px)"><label class="xs lbl" for="pq">'+esc(t('Search'))+'</label><input class="inp" id="pq" type="search" data-in="pq" value="'+esc(P.q)+'" placeholder="'+esc(t('Name, ID, designation'))+'"></div>'+
 '<div class="fld"><label class="xs lbl" for="pd">'+esc(t('Department'))+'</label><select class="inp" id="pd" data-chg="pd">'+empOpts(depts,P.dept)+'</select></div><div class="fld"><label class="xs lbl" for="pt">'+esc(t('Team'))+'</label><select class="inp" id="pt" data-chg="pt">'+empOpts(teams,P.team)+'</select></div></div></div>'+
 '<div class="card tw" id="pplTable"></div>';
 return{html:html,after:pplDraw};
}

function pplDraw(){
 const box=$('#pplTable');if(!box)return;const l=pplList();const c=$('#pplCount');if(c)c.textContent=t('{a} of {b} employees shown',{a:l.length,b:emps().length});
 if(!l.length){box.innerHTML='<div class="pad"><b>'+esc(emps().length?t('No employee matches.'):t('No employees yet.'))+'</b></div>';return}
 const ed=canEdit();const L=k=>' data-l="'+esc(t(k))+'"';
 const body=l.map(e=>{const s=empStats(e.id);
  return '<tr><td'+L('ID')+'>'+esc(e.id)+'</td><td'+L('Name')+'><b>'+esc(e.name)+'</b>'+(e.active===false?' <span class="pill p-soft">'+esc(t('Inactive'))+'</span>':'')+'</td><td'+L('Designation')+'>'+esc(e.designation)+'</td><td'+L('Department')+'>'+esc(e.dept)+'</td><td'+L('Section')+'>'+esc(e.section)+'</td><td'+L('Team')+'>'+esc(e.team)+'</td><td'+L('Time zone')+'>'+esc(e.zone)+'</td><td class="r"'+L('Nominated')+'>'+s.n+'</td><td class="r"'+L('Present')+'>'+s.p+'</td><td class="r"'+L('Absent')+'>'+s.a+'</td><td'+L('Actions')+'><button class="act" data-act="emphist" data-id="'+e.id+'">'+esc(t('History'))+'</button>'+(ed?' <button class="act" data-act="empedit" data-id="'+e.id+'">'+esc(t('Edit'))+'</button> <button class="act" data-act="empdel" data-id="'+e.id+'">'+esc(t('Delete'))+'</button>':'')+'</td></tr>'}).join('');
 const th=['ID','Name','Designation','Department','Section','Team','Time zone','Nominated','Present','Absent'].map((k,i)=>'<th scope="col"'+(i>6?' class="r"':'')+'>'+esc(t(k))+'</th>').join('')+'<th scope="col">'+esc(t('Actions'))+'</th>';
 box.innerHTML='<table class="cards" style="min-width:1000px"><thead><tr>'+th+'</tr></thead><tbody>'+body+'</tbody></table>';
 if(window.innerWidth<=700)box.querySelector('table').style.minWidth='0';
}
ACT.pexp=()=>{const rows=[['ID','Name','Designation','Department','Section','Team','Time zone','Active','Nominated','Present','Absent'].map(t)].concat(emps().map(e=>{const s=empStats(e.id);return[e.id,e.name,e.designation,e.dept,e.section,e.team,e.zone,e.active===false?'No':'Yes',s.n,s.p,s.a]})).concat([[COPY,WM_TXT]]);

CHG.empex=el=>{const x=EMP_EX[+el.value];if(!x)return;$('#ep_name').value=x.name;$('#ep_des').value=x.designation;$('#ep_dept').value=x.dept;$('#ep_sec').value=x.section;$('#ep_team').value=x.team;$('#ep_zone').value=x.zone};
ACT.empsave=el=>{if(!canEdit())return;const id=el.dataset.id;const g=k=>($('#'+k).value||'').trim();
 const name=g('ep_name'),dept=g('ep_dept');let bad=false;
 ['ep_name','ep_dept'].forEach(k=>{const e=$('#'+k+'_e');e.textContent='';});

 const rec={name:name,designation:g('ep_des'),dept:dept,section:g('ep_sec'),team:g('ep_team'),zone:$('#ep_zone').value,active:$('#ep_act').checked};
 if(id){Object.assign(empById(id),rec);logAct('Edited employee '+id)}else{const n=nextEmpId();S.employees.push(Object.assign({id:n},rec));logAct('Added employee '+n)}
 save();closeModal(false);toast('ok',t('Employee saved.'));render()};
ACT.empdel=async el=>{if(!canEdit())return;const e=empById(el.dataset.id);if(!e)return;
 const used=S.trainings.filter(r=>nomOf(r).some(x=>x.e===e.id));
 if(used.length){toast('err',t('{n} training(s) include this employee. Remove them there first, or mark the employee inactive.',{n:used.length}));return}
 const ok=await confirmBox({title:t('Delete this employee?'),body:'<p style="margin:0"><b>'+esc(e.name)+'</b> ('+esc(e.id)+')</p>',ok:t('Delete'),danger:true});if(!ok)return;
 S.employees=S.employees.filter(x=>x.id!==e.id);logAct('Deleted employee '+e.id);save();toast('ok',t('Employee deleted.'));render()};

 const tot=h.reduce((a,x)=>{a.n++;if(x.st==='present'){a.p++;a.h+=hoursOf(x.r)}if(x.st==='absent')a.a++;a.c+=x.share;return a},{n:0,p:0,a:0,h:0,c:0});

  (h.length?'<div class="tw" style="max-height:50vh;overflow:auto"><table style="min-width:520px"><thead><tr><th>'+esc(t('Code'))+'</th><th>'+esc(t('Training'))+'</th><th>'+esc(t('Date'))+'</th><th>'+esc(t('Attendance'))+'</th><th class="r">'+esc(t('Cost share'))+'</th></tr></thead><tbody>'+rows+'</tbody></table></div>':'<div class="muted">'+esc(t('Not nominated for any training yet.'))+'</div>')+empResultsHtml(e.id)+

function fileRows(r){const sh=shares(r);return nomOf(r).map(x=>{const e=empById(x.e)||{id:x.e,name:'?',dept:'',team:'',section:''};return{x:x,e:e,share:sh[x.e]||0,man:hasMan(x)}})}
function vFile(rt){
 if(isScoped())return{html:'<div class="card pad">'+esc(t('Only the Owner can open this page.'))+'</div>'};
 const r=S.trainings.find(x=>x.id===rt.arg);
 if(!r)return{html:'<div class="card pad">'+esc(t('That training was not found.'))+' <a href="#register">'+esc(t('Back to register'))+'</a></div>'};
 const st=attendStats(r);const rows=fileRows(r);const mark=canMark(r),ed=canEdit();
 const total=Number(r.cost)||0;const allocated=rows.reduce((a,x)=>a+x.share,0);const absCost=rows.filter(x=>x.x.st==='absent').reduce((a,x)=>a+x.share,0);
 const kp=(l,v,s)=>'<div class="card pad" style="min-width:0"><div class="lbl">'+esc(t(l))+'</div><div style="font-size:24px;font-weight:700">'+v+'</div>'+(s?'<div class="muted small">'+s+'</div>':'')+'</div>';
 const att=st.present+st.absent;
 const html='<div class="row between"><div><div class="lbl">'+esc(t('Training file'))+' · '+esc(r.code)+'</div><h1 style="font-size:clamp(22px,3.2vw,30px)">'+esc(r.title)+'</h1><div class="muted">'+esc(fmtRange(r))+' · '+esc(r.facilitator)+' · '+pill(status(r))+'</div></div>'+
  '<div class="row">'+(isHR()?'<button class="btn sec" data-act="kit" data-id="'+r.id+'">'+esc(t('Follow-up kit'))+'</button>':'')+'<button class="btn sec" data-act="fprint" data-id="'+r.id+'">'+esc(t('Print / PDF'))+'</button><button class="btn sec" data-act="fcsv" data-id="'+r.id+'">'+esc(t('Export CSV'))+'</button>'+(ed?'<a class="btn sec" href="#edit/'+r.id+'">'+esc(t('Edit'))+'</a>':'')+'<a class="btn" href="#register">'+esc(t('Back to register'))+'</a></div></div>'+
  '<div class="grid g-auto" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr))">'+kp('Nominated',st.nom)+kp('Present',st.present)+kp('Absent',st.absent)+kp('Not marked',st.pending)+kp('Attendance',att?pctOf(st.present,att)+'%':'–',att?esc(t('of {n} marked',{n:att})):'')+kp('Total cost',moneyS(total),st.nom?moneyS(total/st.nom)+' '+esc(t('per nominee')):'')+kp('Cost of absences',moneyS(absCost))+'</div>'+
  (!st.nom?'<div class="ins">'+esc(t('No nominees for this training.'))+(ed?' <a href="#edit/'+r.id+'">'+esc(t('Add nominees'))+'</a>':'')+'</div>':'')+
  (st.nom?'<div class="card pad col"><div class="row between"><h2 style="font-size:18px">'+esc(t('Attendance and cost share'))+'</h2>'+(mark?'<div class="row" style="gap:8px"><button class="btn sec sm" data-act="fbulk" data-k="present" data-id="'+r.id+'">'+esc(t('Mark all present'))+'</button><button class="btn sec sm" data-act="fbulk" data-k="rest" data-id="'+r.id+'">'+esc(t('Mark the rest absent'))+'</button><button class="btn sec sm" data-act="fbulk" data-k="clear" data-id="'+r.id+'">'+esc(t('Clear marks'))+'</button></div>':'')+'</div>'+
   '<div class="muted small">'+esc(ed?(todayStr()>=r.startDate?t('Set attendance for each nominee. Absent people still carry their cost share.'):t('Attendance can be marked from the start date ({d}).',{d:fmtDate(r.startDate,true)})):t('You have view-only access. Only the Owner can add or change records.'))+'</div>'+
   '<div class="tw"><table class="cards" style="min-width:860px"><thead><tr><th>'+esc(t('Employee'))+'</th><th>'+esc(t('Department'))+' › '+esc(t('Team'))+'</th><th>'+esc(t('Attendance'))+'</th><th class="r">'+esc(t('Cost share'))+' ('+esc(T().currency)+')</th></tr></thead><tbody>'+
   rows.map(x=>{const id=x.e.id;const L=k=>' data-l="'+esc(t(k))+'"';
    const a=mark?'<select class="inp" data-chg="fatt" data-id="'+r.id+'" data-e="'+id+'" aria-label="'+esc(t('Attendance')+' '+x.e.name)+'"><option value="nom"'+(x.x.st==='nom'?' selected':'')+'>'+esc(t('Nominated'))+'</option><option value="present"'+(x.x.st==='present'?' selected':'')+'>'+esc(t('Present'))+'</option><option value="absent"'+(x.x.st==='absent'?' selected':'')+'>'+esc(t('Absent'))+'</option></select>':attPill(x.x.st);
    const s=ed?'<div class="row" style="gap:6px;justify-content:flex-end"><input class="inp" id="sh_'+id+'" inputmode="decimal" style="width:120px;text-align:right" data-chg="fshare" data-id="'+r.id+'" data-e="'+id+'" value="'+(x.man?esc(String(x.x.cost)):'')+'" placeholder="'+esc(fmtN(x.share))+'" aria-label="'+esc(t('Cost share')+' '+x.e.name)+'">'+(x.man?'<span class="pill p-pe">'+esc(t('Manual'))+'</span>':'<span class="pill p-ok">'+esc(t('Auto'))+'</span>')+'</div>':fmtN(x.share)+(x.man?' <span class="pill p-pe">'+esc(t('Manual'))+'</span>':'');
    return '<tr><td'+L('Employee')+'><b>'+esc(x.e.name)+'</b> <span class="muted small">'+esc(id)+'</span></td><td'+L('Department')+'>'+esc(x.e.dept)+' › '+esc(x.e.team)+'</td><td'+L('Attendance')+'>'+a+(x.x.at?' <span class="muted small">'+esc(t('checked in'))+'</span>':'')+'</td><td class="r"'+L('Cost share')+'>'+s+'</td></tr>'}).join('')+

  assessCard(r)+trainerReportsCard(r)+(isHR()?'<div class="card pad col"><h2 style="font-size:18px">'+esc(t('Check-in code'))+'</h2><div class="row" style="gap:12px;align-items:center"><code id="ciShow" style="font-size:26px;letter-spacing:.2em;font-weight:700">'+esc(r.ci||'')+'</code>'+(ed?'<button class="btn sec sm" data-act="ciregen" data-id="'+r.id+'">'+esc(t('New code'))+'</button>':'')+'</div><div class="muted small">'+esc(t('Employees give their ID and this code on the Check-in page. It works from the start date to the end date, on this device only.'))+' <a href="#checkin">'+esc(t('Check-in'))+'</a></div></div>':'');
 return{html:html};
}
function attSet(r,id,st){const x=nomOf(r).find(y=>y.e===id);if(!x)return;x.st=st;if(st!=='present')delete x.at}
CHG.fatt=el=>{if(!canMark(S.trainings.find(x=>x.id===el.dataset.id)||{startDate:'9999'}))return;const r=S.trainings.find(x=>x.id===el.dataset.id);attSet(r,el.dataset.e,el.value);logAct('Attendance '+r.code+' '+el.dataset.e+' '+el.value);save();render()};
CHG.fshare=el=>{if(!canEdit())return;const r=S.trainings.find(x=>x.id===el.dataset.id);const x=nomOf(r).find(y=>y.e===el.dataset.e);if(!x)return;
 const raw=el.value.trim().replace(/,/g,'');
 if(raw===''){x.cost=null}else{const n=Number(raw);if(isNaN(n)||n<0){toast('err',t('Enter a number, 0 or more'));render();return}
  const old=x.cost;x.cost=Math.round(n*100)/100;if(manualSum(r)>(Number(r.cost)||0)+1e-9){x.cost=old;toast('err',t('Manual cost shares ({m}) exceed the total cost',{m:fmtN(manualSum(r)+(old!=null?0:n))}));render();return}}
 logAct('Cost share '+r.code+' '+el.dataset.e);save();render()};
ACT.fbulk=el=>{if(!canEdit())return;const r=S.trainings.find(x=>x.id===el.dataset.id);if(!r||todayStr()<r.startDate)return;
 nomOf(r).forEach(x=>{if(el.dataset.k==='present'){x.st='present'}else if(el.dataset.k==='rest'){if(x.st==='nom')x.st='absent'}else{x.st='nom';delete x.at}});
 logAct('Bulk attendance '+r.code+' '+el.dataset.k);save();render()};
ACT.ciregen=async el=>{if(!canEdit())return;const r=S.trainings.find(x=>x.id===el.dataset.id);const ok=await confirmBox({title:t('Make a new check-in code?'),body:'<p style="margin:0">'+esc(t('The old code stops working.'))+'</p>',ok:t('New code')});if(!ok)return;r.ci=ciCode();save();render()};
function fileTable(r){const rows=fileRows(r);return [[t('Employee ID'),t('Name'),t('Department'),t('Section'),t('Team'),t('Attendance'),t('Cost share')+' ('+T().currency+')',t('Manual')]].concat(rows.map(x=>[x.e.id,x.e.name,x.e.dept,x.e.section,x.e.team,t(attLabel(x.x.st)),x.share,x.man?t('Yes'):t('No')]))}
ACT.fcsv=el=>{const r=S.trainings.find(x=>x.id===el.dataset.id);if(!r)return;const rows=fileTable(r).concat([[COPY,WM_TXT]]);

 }else if(by==='trainer'){

  const m={};list.forEach(r=>{const g=m[r.facilitator]=m[r.facilitator]||{n:0,h:0,nom:0,p:0,a:0,c:0,sc:[]};const s=attendStats(r);g.n++;g.h+=hoursOf(r);g.nom+=s.nom;g.p+=s.present;g.a+=s.absent;g.c+=Number(r.cost)||0;if(r.score!=null)g.sc.push(r.score)});
  rows=Object.keys(m).sort().map(k=>{const g=m[k];return[k,g.n,g.h,g.nom,g.p,g.a,money(g.c),g.sc.length?round1(g.sc.reduce((a,b)=>a+b,0)/g.sc.length):null]});
  tot=['Totals'].concat([1,2,3,4,5].map(i=>rows.reduce((a,r)=>a+r[i],0)),[money(rows.reduce((a,r)=>a+r[6],0)),null]);
 }else{
  const key=by==='employee'?null:by==='team'?'team':by==='section'?'section':'dept';
  const m={};
  const G=(e,id)=>{const k=key?(e[key]||'–'):id;if(!m[k]){m[k]={name:e.name,id:id,dept:e.dept,team:e.team,k:k,emps:new Set(),tr:new Set(),nom:0,p:0,a:0,h:0,c:0,ac:0}}return m[k]};
  list.forEach(r=>{const sh=shares(r);nomOf(r).forEach(x=>{const e=empById(x.e)||{name:'?',dept:'',team:'',section:''};const g=G(e,x.e);g.emps.add(x.e);g.tr.add(r.id);g.nom++;const c=sh[x.e]||0;g.c+=c;if(x.st==='present'){g.p++;g.h+=hoursOf(r)}if(x.st==='absent'){g.a++;g.ac+=c}})});

   tot=['','Totals','','',4,5,6].map((x,i)=>i>=4?rows.reduce((a,r)=>a+r[i],0):x);tot.push(null,rows.reduce((a,r)=>a+r[8],0),money(rows.reduce((a,r)=>a+r[9],0)),money(rows.reduce((a,r)=>a+r[10],0)));tot[7]=tot[5]+tot[6]?pctOf(tot[5],tot[5]+tot[6]):null;

   rows=Object.values(m).sort((a,b)=>String(a.k).localeCompare(String(b.k))).map(g=>[g.k,g.emps.size,g.tr.size,g.nom,g.p,g.a,g.p+g.a?pctOf(g.p,g.p+g.a):null,g.h,money(g.c),money(g.ac)]);
   tot=['Totals',rows.reduce((a,r)=>a+r[1],0),null,rows.reduce((a,r)=>a+r[3],0),rows.reduce((a,r)=>a+r[4],0),rows.reduce((a,r)=>a+r[5],0),null,rows.reduce((a,r)=>a+r[7],0),money(rows.reduce((a,r)=>a+r[8],0)),money(rows.reduce((a,r)=>a+r[9],0))];tot[6]=tot[4]+tot[5]?pctOf(tot[4],tot[4]+tot[5]):null;

}

function parseCsv(text){
 text=String(text||'').replace(/^﻿/,'');const rows=[];let row=[],cur='',q=false;
 for(let i=0;i<text.length;i++){const c=text[i];
  if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
  else if(c==='"')q=true;else if(c===','){row.push(cur);cur=''}
  else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[]}
  else cur+=c}
 row.push(cur);if(row.some(x=>x.trim()!==''))rows.push(row);
 return rows.map(r=>r.map(x=>{x=x.trim();return /^'[=+\-@]/.test(x)?x.slice(1):x}));
}

function imEmployees(rows){
 const m=colMap(rows[0],{name:['name','employee name','full name'],des:['designation','title','position'],dept:['department','dept'],sec:['section'],team:['team'],zone:['time zone','timezone','zone'],id:['id','employee id'],act:['active']});
 const items=[],errs=[];
 if(m.name<0||m.dept<0){return{items:[],errs:[t('Columns "Name" and "Department" are required.')],total:0}}
 const seen=new Set(emps().map(e=>(e.name+'|'+e.dept).toLowerCase()));
 rows.slice(1).forEach((r,i)=>{const L=i+2;const g=k=>m[k]>=0?(r[m[k]]||'').trim():'';
  const rec={name:g('name'),designation:g('des'),dept:g('dept'),section:g('sec'),team:g('team'),zone:g('zone')||'Asia/Dhaka',active:g('act')===''?true:yes(g('act'))};
  if(!rec.name){errs.push(t('Row {n}: name is missing.',{n:L}));return}
  if(!rec.dept){errs.push(t('Row {n}: department is missing.',{n:L}));return}
  if(rec.name.length>60||rec.dept.length>40){errs.push(t('Row {n}: a value is too long.',{n:L}));return}
  if(!ZONES.includes(rec.zone)){errs.push(t('Row {n}: unknown time zone {z}.',{n:L,z:rec.zone}));return}
  const ex=g('id')?empById(g('id')):null;
  if(ex){items.push({label:t('Update {n}',{n:ex.name}),run:()=>{Object.assign(ex,rec)}});return}
  const key=(rec.name+'|'+rec.dept).toLowerCase();if(seen.has(key)){errs.push(t('Row {n}: {x} already exists.',{n:L,x:rec.name}));return}
  seen.add(key);items.push({label:t('Add {n}',{n:rec.name}),run:()=>{S.employees.push(Object.assign({id:nextEmpId()},rec))}});
 });
 return{items:items,errs:errs,total:rows.length-1};
}

   const pct=round1(mk*100/tot);items.push({label:id+' · '+tr.code+' · '+mk+'/'+tot,run:()=>{pushRes(tr,x,{marks:mk,total:tot,pct:pct,passed:pct>=asPass(tr),by:'import'})}});
  }});
 return{items:items,errs:errs,total:rows.length-1};
}

function mergePlan(o){
 const p={addT:[],newer:[],older:0,same:0,addE:[],clash:0};
 (o.employees||[]).forEach(e=>{if(e&&e.id&&e.name&&!empById(e.id))p.addE.push(e)});
 (o.trainings||[]).forEach(r=>{if(!r||!r.id||typeof r.title!=='string'||!parseD(r.startDate))return;
  const l=S.trainings.find(x=>x.id===r.id);
  if(!l){if(S.trainings.some(x=>x.code===r.code))p.clash++;p.addT.push(r)}
  else{const a=r.updatedAt||r.createdAt||'',b=l.updatedAt||l.createdAt||'';if(a>b)p.newer.push(r);else if(a<b)p.older++;else p.same++}});
 return p;
}

const Q_EXAMPLE='Q: Which tool shows who attended a training?\nA) Attendance sheet\nB) Weather report\nC) Menu card\nD) Blank page\nAnswer: A\nMarks: 20\n\nQ: A SMART goal should be...\nA) Vague\nB) Measurable and dated\nC) Secret\nAnswer: B\nMarks: 20';
function parseQs(text){
 const out=[],errs=[];text.replace(/\r/g,'').split(/\n\s*\n/).forEach((blk,bi)=>{blk=blk.trim();if(!blk)return;
  const q={q:'',opts:['','','',''],ans:-1,marks:10};let ok=true;
  blk.split('\n').forEach(l=>{l=l.trim();let m;
   if(m=/^(?:Q(?:uestion)?\s*\d*\s*[:.)]|\d+[.)])\s*(.+)$/i.exec(l))q.q=m[1].trim();
   else if(m=/^([A-D])[).:]\s*(.+)$/i.exec(l))q.opts['ABCD'.indexOf(m[1].toUpperCase())]=m[2].trim();
   else if(m=/^Answer\s*[:=]\s*([A-D])/i.exec(l))q.ans='ABCD'.indexOf(m[1].toUpperCase());
   else if(m=/^Marks?\s*[:=]\s*(\d+)/i.exec(l))q.marks=Math.min(100,Math.max(1,parseInt(m[1],10)));
   else if(!q.q)q.q=l});
  if(!q.q||q.q.length>200){errs.push(t('Block {n}: question text is missing or too long.',{n:bi+1}));ok=false}
  if(q.opts.filter(Boolean).length<2){errs.push(t('Block {n}: give at least two options.',{n:bi+1}));ok=false}
  if(q.ans<0||!q.opts[q.ans]){errs.push(t('Block {n}: the answer must be one of the filled options.',{n:bi+1}));ok=false}
  if(ok)out.push(q)});
 return{out:out,errs:errs};
}

function insights(l,all){
 const out=[];
 const tt=totals(l);
 const by={};l.forEach(r=>{const k=r.startDate.slice(0,7);by[k]=(by[k]||0)+r.cost});
 const ks=Object.keys(by).sort((a,b)=>by[b]-by[a]);
 if(ks.length>=3&&tt.cost>0){const two=by[ks[0]]+by[ks[1]];const pc=Math.round(two/tt.cost*100);if(pc>=50){const nm=k=>monName(+k.slice(5)-1);out.push(t('{p}% of spend sits in two months. {a} and {b} carry {c} of {d}.',{p:pc,a:nm(ks[0]),b:nm(ks[1]),c:fmtN(two),d:fmtN(tt.cost)}))}}
 const lw=l.filter(isLow).length,pe=l.filter(r=>status(r)==='Pending Feedback').length;
 if(lw||pe)out.push(t('{a} training(s) are below the {l} line and {b} have no score yet. Open the Improvement tracker.',{a:lw,l:T().lowLine,b:pe}));
 const withP=l.filter(r=>r.participants>0&&r.cost>0).sort((a,b)=>b.cost/b.participants-a.cost/a.participants)[0];
 if(withP)out.push(t('Highest cost per participant: {x} at {c} {u}.',{x:withP.title,c:fmtN(Math.round(withP.cost/withP.participants)),u:T().currency}));
 if(!out.length)out.push(t('No special pattern found in this selection.'));
 return out;
}

function crcTable(){const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t}
const CRC=crcTable();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function zipStore(files){
 const enc=new TextEncoder();const chunks=[];const cen=[];let off=0;
 const now=new Date();const dt=((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate();const tm=(now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1);
 files.forEach(f=>{const name=enc.encode(f.name),data=typeof f.data==='string'?enc.encode(f.data):f.data,crc=crc32(data);
  const lh=new DataView(new ArrayBuffer(30));lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint16(10,tm,true);lh.setUint16(12,dt,true);lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);lh.setUint16(26,name.length,true);lh.setUint16(28,0,true);
  chunks.push(new Uint8Array(lh.buffer),name,data);
  const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,tm,true);ch.setUint16(14,dt,true);ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);ch.setUint16(28,name.length,true);ch.setUint32(42,off,true);
  cen.push(new Uint8Array(ch.buffer),name);off+=30+name.length+data.length});
 let cs=0;cen.forEach(c=>cs+=c.length);
 const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
 return new Blob(chunks.concat(cen,[new Uint8Array(e.buffer)]),{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
const colL=n=>{let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26)}return s};
const xesc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');

 const files=[{name:'[Content_Types].xml',data:ct},{name:'_rels/.rels',data:rels},{name:'xl/workbook.xml',data:wb},{name:'xl/_rels/workbook.xml.rels',data:wr},{name:'xl/styles.xml',data:st}].concat(sheets.map((s,i)=>({name:'xl/worksheets/sheet'+(i+1)+'.xml',data:sheetXml(s.rows,s.widths)})));

function restoreFile(e){
 if(SHOWCASE){toast('info',t('Restore from a file is off in the demo.'));try{e.target.value=''}catch(x){}return}

 const f=e.target.files[0];if(!f)return;const fr=new FileReader();
 fr.onload=async()=>{try{const o=JSON.parse(fr.result);if(!o||!o.settings||!Array.isArray(o.trainings))throw new Error(t('This is not a backup file from this system.'));
  const bad=o.trainings.filter(r=>!r||typeof r.title!=='string'||!parseD(r.startDate)||!parseD(r.endDate)||typeof r.cost!=='number'||typeof r.participants!=='number').length;if(bad)throw new Error(t('{n} record(s) in the file are damaged.',{n:bad}));
  const ok=await confirmBox({title:t('Restore this backup?'),body:'<p style="margin:0">'+esc(t('The file holds {n} records. They will replace everything here, and you will be signed out.',{n:o.trainings.length}))+'</p>',ok:t('Restore'),danger:true});if(!ok)return;
  const d=defaults();o.settings=Object.assign(d.settings,o.settings);o.settings.dash=Object.assign(d.settings.dash,o.settings.dash||{});S=Object.assign(d,o);migrate(S);save();sessionSet(null);toast('ok',t('Backup restored. Please sign in again.'));location.hash='';render()}catch(x){toast('err',x.message||String(x))}};
 fr.readAsText(f);e.target.value='';
}

  ['7. Assessments and employee link','<p class="grey">Comes in version 2 and 3: nominated employee IDs, attendance, cost sharing, assessment links, exam history, manager views. Not installed in this version.</p>'],
  ['8. Settings and access','<p>Settings: system name, language, time zone, currency (label or conversion by a rate you type), financial year start, low-score line, competency list, theme, Lumi, date used for status, backup and restore. <b>Access</b> (Owner): lock switch (Open, Locked, Private), viewer codes, passcode, login log and activity log.</p>'],
  ['9. Rules and limits','<ul><li>Feedback: 1 to 5, average shown to one decimal; below the low line (3.5) = Low.</li><li>Duration never exceeds 24 hours per day. 20:00 to 00:00 needs the +1 tick and equals 4 hours.</li><li>Data is kept in this browser only. Use Backup to move or protect it.</li><li>Currency change does not use live exchange rates.</li><li>Passcode and codes are checked inside the browser: they stop casual visitors, not determined ones.</li></ul>'],
  ['10. People and nominees','<p>Open <b>People</b> to keep the employee directory: ID (E-0001...), name, designation, department, section, team and home time zone. The Owner can add, edit and delete. An employee who is nominated in any training cannot be deleted; mark them <i>inactive</i> instead. <i>History</i> shows every training of one person with attendance and cost share.</p><p>On <b>Add training</b>, section 6 lets you pick nominees with search and department/team filters. A warning shows if the person is already nominated for an overlapping date. <i>Use as registered participants</i> copies the count into the participants field.</p>'],
  ['11. Attendance and cost sharing','<p>Open a training from the register and choose <b>Training file</b>. From the start date the Owner marks each nominee Present or Absent, or uses the bulk buttons. Employees can also use <b>Check-in</b> with their ID and the training code; it works from the start to the end date, on this device only.</p><p>The total cost is shared equally among nominees. Absent people still carry their share (shown in <i>Cost of absences</i>). Type a share in a box to set it manually (<i>Manual</i>); the rest is split among automatic shares. Manual shares cannot exceed the total. Clear a box to return to automatic. Cents left over go to the first nominees so the sum is exact.</p>'],
  ['12. Reports','<p>Open <b>Reports</b> and choose by training, trainer, employee, team, section or department, for all time or one financial year. Totals sit at the bottom. Export as CSV, Excel or PDF. Cost of trainings with no nominees is not given to anyone and a note says so. The full register export also has Employees and Nominations sheets.</p><p><b>Period</b>: All time, Financial year, Calendar year, One month, or Month to month (pick the first and last month). The chosen period is shown under the table and used in every export. <b>L&amp;D scorecard by department</b> shows coverage (who attended at least one training), hours per employee, cost per employee, cost per hour, attendance and pass rate, the measures most L&amp;D scorecards use.</p>'],
  ['13. Roles and access codes','<p>The Owner gives each person an <b>access code</b> on the Access page and picks a role: <b>HR</b> (edit trainings, people, attendance and assessments, but not Access or system settings), <b>Head of department</b> and <b>Line manager</b> (see only the people of their department or team in <i>Team view</i>), <b>Employee</b> (sees only their own learning in <i>My learning</i>) and <b>Viewer</b> (sees everything, changes nothing). Codes can be revoked or given an expiry date.</p><p><b>Honest limit:</b> roles are enforced inside this browser. They keep ordinary users in their lane, but anyone with full access to the device holding the data could still read it. Real security needs a server.</p>'],
  ['14. Assessments','<p>In a Training File, set up an <b>Assessment</b>: multiple-choice questions with marks, a pass mark (default 60%) and a grace period after the end. It opens when the training starts and closes at the end plus the grace period, in the training time zone. HR issues a <b>one-time link</b> to each nominee and copies or exports them. The person answers once; the score is saved. HR can also <b>enter marks</b> by hand, and can give a <b>new link</b> for another attempt. Earlier results stay in the history. Once results exist the questions are locked.</p>'],
  ['15. My learning and Team view','<p>An employee opens <b>My learning</b>: own trainings, attendance, assessments to take, and result history. A head or manager opens <b>Team view</b>: attendance, hours, assessment results and cost share for their people. <b>Reports</b> has a separate Assessments section by training, employee or department.</p>'],
  ['16. Import, merge and follow-up','<p>Open <b>Import and tools</b>. Download a template, fill it in Excel or a text editor, save as CSV and choose it. You see a <b>preview</b> first: rows that are ready and rows with problems (skipped). Nothing changes until you press Apply. You can import employees, trainings, attendance and assessment results from paper or offline exams.</p><p><b>Merge from another device</b>: export a <i>sync pack</i> on one device and merge it on another. Newer copies of a training win; people and access codes are not overwritten. This is manual sync by file, not live sync.</p><p>In a Training File, <b>Follow-up kit</b> prepares messages in English or Bangla (reminder, assessment link, absent, thank-you and feedback, below pass mark) and <b>AI helper prompts</b> that you paste into an AI chat yourself; nothing is sent from here and no names are included. <b>Paste questions</b> adds assessment questions from text. Settings lets the Owner rename and recolour <b>Lumi</b>.</p>'],
  ['17. Accounts, portals and trainer feedback','<p>Owner opens <b>Access</b> and makes <b>People accounts</b>: pick a role (HR Manager, HR Executive, Head, Line manager, Employee, Trainer), optionally a name and ID, then <b>New account</b>. The passcode is shown once. <b>Create accounts for all employees</b> gives every employee their employee ID and a random passcode, with a CSV to hand out. A lost passcode is replaced with <b>New passcode</b>. People sign in on the first page with <b>ID and passcode</b>. Every passcode box has a <b>Show</b> button so you can check what you typed.</p><ul><li><b>Employee</b>: only their own page: trainings, attendance, assessment results, the questions with their own answers (<b>Review answers</b>) and the trainer\'s notes about them.</li><li><b>Line manager / Head</b>: their team or department (no other), and their own learning page if an employee is linked to the account.</li><li><b>Trainer</b>: only trainings where the facilitator name matches. Sees participant feedback and comments, assessment results of participants, never costs. Writes a note and rating per participant and submits a report as text or files (Excel, CSV, PDF, Word, text, up to 500 KB each). HR reads them in the Training File.</li><li><b>HR Manager / HR Executive</b>: everything, including cost. Only the Owner can create accounts.</li></ul><p class="grey">Honest limit: IDs and passcodes are checked inside this browser, so they keep casual visitors out but are not server security, and an account works only in the browser that holds the data. Real multi-device sign-in needs a server.</p>'],
  ['18. Terms of use','TERMS']];
 const bn=[
  ['১. শুরু করুন','<p>সিস্টেম খুলে সাইন ইন করুন। <b>মালিক (Owner)</b> পাসকোড দিয়ে ঢুকে যোগ, পরিবর্তন ও মুছতে পারেন। <b>দর্শক (Viewer)</b> মালিকের দেওয়া কোড দিয়ে শুধু দেখতে পারেন। পাশের তালিকা থেকে ইংরেজি বা বাংলা বেছে নিন। সেটিংসে তিনটি থিম ও Lumi গাইড আছে (সবুজ = হয়েছে, লাল = ঠিক করুন)।</p>'],
  ['২. প্রশিক্ষণ যোগ করুন','<p><b>Add training</b> খুলুন। * চিহ্নিত ঘর পূরণ করতেই হবে। নির্দিষ্ট উত্তর বেছে নিতে হয়, লিখতে নয়।</p><ul><li><b>শিরোনাম ও তারিখ:</b> সমাপ্তির তারিখ শুরুর আগে হতে পারবে না। একই শিরোনাম ও শুরুর তারিখ থাকলে সতর্কতা আসবে।</li><li><b>সময় (from/to):</b> "to" সময় "from"-এর পরে হতে হবে। মধ্যরাত পেরিয়ে শেষ হলে "Ends next day (+1)" টিক দিন।</li><li><b>সময়অঞ্চল:</b> প্রশিক্ষণের সময়অঞ্চল দিন। অন্যরা নিজেদের সময় দেখবেন।</li><li><b>সময়কাল (Duration):</b> স্বয়ংক্রিয়: (to − from) × দিনের সংখ্যা। হাতে বদলালে <i>Manual</i> দেখাবে; <i>Reset to auto</i> ফিরিয়ে আনবে।</li><li><b>অংশগ্রহণকারী:</b> পূর্ণসংখ্যা, ০ বা তার বেশি। <b>খরচ:</b> ০ বা তার বেশি (০ হলে ঠিক আছে)। <b>ফিডব্যাক স্কোর:</b> ১ থেকে ৫, সর্বোচ্চ এক দশমিক; সমাপ্তির পরেই দেওয়া যায়; প্রান্তের বাইরে হলে গ্রহণ হয় না।</li></ul><p><b>অবস্থা (Status) স্বয়ংক্রিয়:</b> সমাপ্তির তারিখ আজ বা পরে = <i>Upcoming</i>; সমাপ্ত ও স্কোর আছে = <i>Completed</i>; সমাপ্ত কিন্তু স্কোর নেই = <i>Pending Feedback</i>।</p>'],
  ['৩. রেজিস্টার','<p>সব প্রশিক্ষণ এক টেবিলে। সার্চ বক্স, ফিল্টার (ধরন, পরিধি, ফ্যাসিলিটেটর, অবস্থা, তারিখ), কলামের নামে ক্লিক করে সাজানো। <b>View</b> সব তথ্য দেখায়। <b>Edit</b> ও <b>Delete</b> শুধু মালিকের। গোলাপি সারিতে স্কোর সীমার নিচে। শেষ সারিতে যা দেখছেন তার যোগফল।</p>'],
  ['৤. ড্যাশবোর্ড','<p>মোট (প্রশিক্ষণ, ঘণ্টা, অংশগ্রহণকারী, খরচ, গড় ফিডব্যাক) ও চার্ট: মাসভিত্তিক, ধরন/পরিধি/অবস্থা, ফ্যাসিলিটেটরের ফিডব্যাক, খরচ বনাম স্কোর, কম স্কোর। সব ফিল্টার করতে বার বা অংশে ক্লিক করুন। তৈরি ভিউ বা <b>Customize</b> দিয়ে কোনটি দেখবেন ও ক্রম ঠিক করুন। বছরের তীর দিয়ে অর্থবছর বদলান। প্রতিটি চার্ট টেবিল আকারেও দেখা যায়।</p>'],
  ['৫. রিপোর্ট','<p>প্রথম সংস্করণে রিপোর্ট মানে রেজিস্টার, ড্যাশবোর্ড ও ইমপ্রুভমেন্ট ট্র্যাকার, সবই এক্সপোর্টযোগ্য। প্রশিক্ষণ কোড, ট্রেইনার, কর্মী, টিম, সেকশন ও বিভাগভিত্তিক রিপোর্ট দ্বিতীয় সংস্করণে আসবে।</p>'],
  ['৬. ইমপ্রুভমেন্ট ও এক্সপোর্ট','<p><b>Improvement tracker</b> ফিডব্যাক ও সুপারিশ দেখায়, সবচেয়ে কম স্কোর আগে; কম স্কোর হাইলাইট হয়; কাজ হলে <i>Actioned</i> টিক দিন। <b>Export</b> তালিকায় Excel, CSV, Word, PDF (প্রিন্ট উইন্ডোয় Save as PDF বেছে নিন) ও Backup আছে। এক্সপোর্ট বর্তমান পর্দার ফিল্টার অনুসারে হয়।</p>'],
  ['৭. অ্যাসেসমেন্ট ও কর্মী লিংক','<p class="grey">সংস্করণ ২ ও ৩-এ আসছে: মনোনীত কর্মীর আইডি, উপস্থিতি, খরচ বন্টন, অ্যাসেসমেন্ট লিংক, পরীক্ষার ইতিহাস। এই সংস্করণে নেই।</p>'],
  ['৮. সেটিংস ও অ্যাক্সেস','<p>সেটিংস: সিস্টেমের নাম, ভাষা, সময়অঞ্চল, মুদ্রা (শুধু লেবেল বা আপনার দেওয়া হারে রূপান্তর), অর্থবছর শুরুর মাস, কম-স্কোর সীমা, দক্ষতার তালিকা, থিম, Lumi, অবস্থার জন্য ব্যবহৃত তারিখ, ব্যাকআপ ও রিস্টোর। <b>Access</b> (মালিক): লক (Open, Locked, Private), দর্শক কোড, পাসকোড, লগইন লগ ও কাজের লগ।</p>'],
  ['৯. নিয়ম ও সীমা','<ul><li>ফিডব্যাক: ১ থেকে ৫, গড় এক দশমিকে; সীমার (৩.৫) নিচে = Low।</li><li>প্রতিদিন সর্বোচ্চ ২৪ ঘণ্টা। ২০:০০ থেকে ০০:০০ হলে +1 টিক লাগবে ও ২০:০০–০০:০০ = ৪ ঘণ্টা।</li><li>ডেটা শুধু এই ব্রাউজারে থাকে। সরাতে বা রক্ষায় Backup ব্যবহার করুন।</li><li>মুদ্রা বদলে লাইভ মুদ্রার হার ব্যবহার হয় না।</li><li>পাসকোড ও কোড ব্রাউজারের ভেতরে যাচাই হয়: সাধারণ আগন্তুককে থামায়, দক্ষ কাউকে নয়।</li></ul>'],
  ['১০. কর্মী ও নমিনি','<p><b>People</b> পেজে কর্মীদের তালিকা রাখুন: আইডি (E-0001...), নাম, পদবি, বিভাগ, সেকশন, টিম ও নিজ টাইম জোন। মালিক যোগ, সম্পাদনা ও মুছতে পারবেন। কোনো ট্রেনিংয়ে নমিনি থাকলে কর্মীকে মোছা যায় না; তাকে <i>নিষ্ক্রিয়</i> করুন। <i>ইতিহাস</i>-এ একজনের সব ট্রেনিং, উপস্থিতি ও খরচের ভাগ দেখা যায়।</p><p><b>ট্রেনিং যোগ</b> পেজের ৬ নম্বর অংশে সার্চ ও বিভাগ/টিম ফিল্টার দিয়ে নমিনি বাছুন। একই সময়ে অন্য ট্রেনিংয়ে নমিনি থাকলে সতর্কতা দেখায়। <i>নিবন্ধিত অংশগ্রহণকারী হিসেবে নিন</i> সংখ্যাটি অংশগ্রহণকারী ঘরে বসায়।</p>'],
  ['১১. উপস্থিতি ও খরচ ভাগ','<p>রেজিস্টার থেকে ট্রেনিং খুলে <b>ট্রেনিং ফাইল</b> বাছুন। শুরুর তারিখ থেকে মালিক প্রতিজন নমিনিকে উপস্থিত বা অনুপস্থিত দেন, অথবা একসাথে করার বোতাম ব্যবহার করেন। কর্মীরা নিজের আইডি ও ট্রেনিং কোড দিয়ে <b>চেক-ইন</b> করতে পারেন; এটি শুরু থেকে শেষ তারিখ পর্যন্ত, শুধু এই ডিভাইসে চলে।</p><p>মোট খরচ নমিনিদের মধ্যে সমান ভাগ হয়। অনুপস্থিতরাও নিজের ভাগ বহন করেন (<i>অনুপস্থিতির খরচ</i>-এ দেখা যায়)। ঘরে সংখ্যা লিখলে সেটি হাতে দেওয়া ভাগ হয় (<i>Manual</i>); বাকিটা স্বয়ংক্রিয় অংশগুলোতে ভাগ হয়। হাতে দেওয়া ভাগ মোট খরচ ছাড়াতে পারে না। ঘর খালি করলে স্বয়ংক্রিয়ে ফেরে। অবশিষ্ট পয়সা প্রথম নমিনিদের দেওয়া হয় যাতে যোগফল ঠিক থাকে।</p>'],
  ['১২. রিপোর্ট','<p><b>Reports</b> খুলে ট্রেনিং, প্রশিক্ষক, কর্মী, টিম, সেকশন বা বিভাগ অনুযায়ী, সব সময় বা একটি অর্থবছরের জন্য বাছুন। নিচে মোট থাকে। সিএসভি, এক্সেল বা পিডিএফ এক্সপোর্ট করা যায়। নমিনিহীন ট্রেনিংয়ের খরচ কারও নামে ভাগ হয় না, একটি নোটে তা বলা থাকে। পূর্ণ রেজিস্টার এক্সপোর্টে কর্মী ও নমিনেশন শিট থাকে।</p><p><b>সময়কাল</b>: সব সময়, অর্থবছর, ক্যালেন্ডার বছর, একটি মাস, অথবা মাস থেকে মাস (প্রথম ও শেষ মাস বাছুন)। বাছা সময় টেবিলের নিচে দেখায় এবং প্রতিটি এক্সপোর্টে কাজ করে। <b>L&amp;D স্কোরকার্ড (বিভাগ অনুযায়ী)</b>: কভারেজ (অন্তত একটি প্রশিক্ষণে উপস্থিত), প্রতি কর্মীর ঘণ্টা, প্রতি কর্মীর খরচ, প্রতি ঘণ্টার খরচ, উপস্থিতি ও পাসের হার দেখায়।</p>'],
  ['১৩. রোল ও অ্যাক্সেস কোড','<p>মালিক Access পেজে প্রত্যেককে একটি <b>অ্যাক্সেস কোড</b> দেন ও রোল বাছেন: <b>এইচআর</b> (ট্রেনিং, কর্মী, উপস্থিতি ও অ্যাসেসমেন্ট সম্পাদনা করতে পারেন; Access ও সিস্টেম সেটিংস নয়), <b>বিভাগীয় প্রধান</b> ও <b>লাইন ম্যানেজার</b> (<i>Team view</i>-এ শুধু নিজের বিভাগ বা টিমের লোকদের দেখেন), <b>কর্মী</b> (<i>My learning</i>-এ শুধু নিজেরটা দেখেন) এবং <b>দর্শক</b> (সব দেখেন, কিছু বদলান না)। কোড বাতিল করা যায় বা মেয়াদ দেওয়া যায়।</p><p><b>সৎ সীমা:</b> রোল এই ব্রাউজারের ভেতরেই কার্যকর হয়। সাধারণ ব্যবহারকারীকে নিজের সীমায় রাখে, কিন্তু তথ্য-রাখা ডিভাইসে পূর্ণ প্রবেশাধিকার থাকলে কেউ তা পড়তে পারে। আসল নিরাপত্তার জন্য সার্ভার লাগে।</p>'],
  ['১৪. অ্যাসেসমেন্ট','<p>ট্রেনিং ফাইলে <b>অ্যাসেসমেন্ট</b> সেট করুন: নম্বরসহ বহুনির্বাচনী প্রশ্ন, পাস নম্বর (ডিফল্ট ৬০%) ও শেষের পর বাড়তি সময়। ট্রেনিং শুরুতে এটি খোলে এবং শেষ + বাড়তি সময়ে বন্ধ হয়, ট্রেনিংয়ের টাইম জোনে। এইচআর প্রতিজন নমিনিকে <b>একবারের লিংক</b> দেন, কপি বা এক্সপোর্ট করেন। ব্যক্তি একবার উত্তর দেন; স্কোর সংরক্ষিত হয়। এইচআর হাতে <b>নম্বর</b>ও দিতে পারেন, আবার চেষ্টার জন্য <b>নতুন লিংক</b> দিতে পারেন। আগের ফলাফল ইতিহাসে থাকে। ফলাফল থাকলে প্রশ্ন বদলানো যায় না।</p>'],
  ['১৫. আমার শেখা ও টিম ভিউ','<p>কর্মী <b>My learning</b> খোলেন: নিজের ট্রেনিং, উপস্থিতি, দেওয়ার মতো অ্যাসেসমেন্ট ও ফলাফলের ইতিহাস। প্রধান বা ম্যানেজার <b>Team view</b> খোলেন: নিজের লোকদের উপস্থিতি, ঘণ্টা, অ্যাসেসমেন্ট ফল ও খরচের ভাগ। <b>Reports</b>-এ ট্রেনিং, কর্মী বা বিভাগ অনুযায়ী আলাদা অ্যাসেসমেন্ট অংশ আছে।</p>'],
  ['১৬. ইমপোর্ট, মেলানো ও ফলো-আপ','<p><b>Import and tools</b> খুলুন। টেমপ্লেট নামান, এক্সেল বা টেক্সট এডিটরে পূরণ করে সিএসভি হিসেবে সেভ করে বাছুন। আগে একটি <b>প্রিভিউ</b> দেখায়: যে সারি তৈরি ও যেগুলোয় সমস্যা (বাদ যাবে)। Apply চাপার আগে কিছু বদলায় না। কর্মী, ট্রেনিং, উপস্থিতি এবং কাগজে বা অফলাইন পরীক্ষার ফল ইমপোর্ট করা যায়।</p><p><b>অন্য ডিভাইস থেকে মেলানো</b>: এক ডিভাইসে <i>সিঙ্ক প্যাক</i> এক্সপোর্ট করে অন্যটিতে মেলান। ট্রেনিংয়ের নতুন কপি জেতে; কর্মী ও অ্যাক্সেস কোড মুছে যায় না। এটি ফাইলে হাতে-করা সিঙ্ক, লাইভ সিঙ্ক নয়।</p><p>ট্রেনিং ফাইলে <b>ফলো-আপ কিট</b> ইংরেজি বা বাংলায় বার্তা তৈরি করে (স্মরণ, অ্যাসেসমেন্ট লিংক, অনুপস্থিত, ধন্যবাদ ও ফিডব্যাক, পাস নম্বরের নিচে) এবং <b>এআই সহায়ক প্রম্পট</b> দেয় যা আপনি নিজে এআই চ্যাটে পেস্ট করেন; এখান থেকে কিছু পাঠানো হয় না, কোনো নামও থাকে না। <b>প্রশ্ন পেস্ট করুন</b> লেখা থেকে অ্যাসেসমেন্টের প্রশ্ন যোগ করে। সেটিংসে মালিক <b>লুমি</b>র নাম ও রং বদলাতে পারেন।</p>'],
  ['১৭. অ্যাকাউন্ট, পোর্টাল ও ট্রেইনারের ফিডব্যাক','<p>মালিক <b>Access</b> খুলে <b>ব্যক্তির অ্যাকাউন্ট</b> বানান: ভূমিকা বাছুন (HR ম্যানেজার, HR এক্সিকিউটিভ, প্রধান, লাইন ম্যানেজার, কর্মী, ট্রেইনার), চাইলে নাম ও আইডি দিন, তারপর <b>নতুন অ্যাকাউন্ট</b>। পাসকোড একবারই দেখানো হয়। <b>সব কর্মীর অ্যাকাউন্ট তৈরি করুন</b> চাপলে প্রত্যেকে নিজের কর্মী আইডি ও এলোমেলো পাসকোড পান, বিলির জন্য CSV আসে। পাসকোড হারালে <b>নতুন পাসকোড</b> দিন। প্রথম পাতায় <b>আইডি ও পাসকোড</b> দিয়ে ঢুকতে হয়। প্রতিটি পাসকোড ঘরে <b>দেখান</b> বোতাম আছে, কী টাইপ করেছেন মিলিয়ে নিতে।</p><ul><li><b>কর্মী</b>: শুধু নিজের পাতা: প্রশিক্ষণ, উপস্থিতি, অ্যাসেসমেন্ট ফল, প্রশ্ন ও নিজের উত্তর (<b>উত্তর দেখুন</b>) এবং নিজের সম্পর্কে ট্রেইনারের নোট।</li><li><b>লাইন ম্যানেজার / প্রধান</b>: শুধু নিজের টিম বা বিভাগ, আর অ্যাকাউন্টে কর্মী যুক্ত থাকলে নিজের শেখার পাতা।</li><li><b>ট্রেইনার</b>: শুধু সেই প্রশিক্ষণ যেখানে ফ্যাসিলিটেটরের নাম মেলে। অংশগ্রহণকারীদের ফিডব্যাক, মন্তব্য ও অ্যাসেসমেন্ট ফল দেখেন, খরচ কখনও নয়। প্রতিজনের জন্য নোট ও রেটিং লেখেন এবং লেখা বা ফাইল (Excel, CSV, PDF, Word, টেক্সট, প্রতিটি সর্বোচ্চ ৫০০ KB) দিয়ে রিপোর্ট জমা দেন। HR ট্রেনিং ফাইলে তা পড়ে।</li><li><b>HR ম্যানেজার / HR এক্সিকিউটিভ</b>: খরচসহ সবকিছু। অ্যাকাউন্ট বানাতে পারেন শুধু মালিক।</li></ul><p class="grey">সৎ সীমা: আইডি ও পাসকোড এই ব্রাউজারের ভেতরেই যাচাই হয়, তাই সাধারণ দর্শক ঠেকায় কিন্তু সার্ভার-নিরাপত্তা নয়; অ্যাকাউন্ট কেবল সেই ব্রাউজারে কাজ করে যেখানে তথ্য আছে। একাধিক ডিভাইসে সত্যিকারের লগইনের জন্য সার্ভার লাগবে।</p>'],
  ['১৮. ব্যবহারের শর্ত','TERMS']];
 return lang()==='bn'?bn:en;

const TF_MAX=500*1024;
function readFileB64(f){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]||'');fr.onerror=()=>rej(fr.error);fr.readAsDataURL(f)})}
ACT.trsubmit=async el=>{const r=myTr(el.dataset.r);const er=$('#tfErr');if(!r)return;er.classList.remove('on');
 if(S.settings.lock==='locked'){er.textContent=t('The system is locked (read-only).');er.classList.add('on');return}
 const text=$('#sh_tf_text').value.trim(),score=+$('#sh_tf_score').value||null;const fl=[...(($('#sh_tf_file')||{}).files||[])];
 if(!text&&!fl.length){er.textContent=t('Write something or attach a file first.');er.classList.add('on');return}
 if(fl.length>3){er.textContent=t('Attach at most 3 files at a time.');er.classList.add('on');return}
 const files=[];
 for(const f of fl){if(f.size>TF_MAX){er.textContent=t('"{n}" is bigger than 500 KB.',{n:f.name});er.classList.add('on');return}
  if(!/\.(csv|txt|xlsx|xls|pdf|doc|docx|odt|ods)$/i.test(f.name)){er.textContent=t('"{n}" is not a supported file type.',{n:f.name});er.classList.add('on');return}
  const b=await readFileB64(f);const o={name:f.name.slice(0,80),type:f.type||'application/octet-stream',size:f.size,b64:b};
  if(/\.(csv|txt)$/i.test(f.name)){try{o.text=atob(b).slice(0,20000)}catch(e){}}files.push(o)}
 r.tfb=r.tfb||[];const entry={at:nowISO(),by:SESSION.label||r.facilitator,score:score,text:text,files:files};r.tfb.push(entry);
 if(!save()){r.tfb.pop();er.textContent=t('The browser storage is full, so this could not be kept. Try smaller files, or ask HR to export a backup and free space.');er.classList.add('on');return}
 logAct('Trainer report submitted '+r.code);save();toast('ok',t('Your feedback was submitted.'));render()};

/* ---- L&D scorecard report ---- */
function repScore(list){
 const act=emps().filter(e=>e.active!==false);const by={};
 const g=d=>by[d]=by[d]||{emp:0,tr:new Set(),h:0,c:0,p:0,a:0,took:0,pass:0};
 act.forEach(e=>{g(e.dept||'–').emp++});
 list.forEach(r=>{const sh=shares(r);nomOf(r).forEach(x=>{const e=empById(x.e);if(!e)return;const o=g(e.dept||'–');o.c+=sh[x.e]||0;if(x.st==='present'){o.p++;o.h+=hoursOf(r);o.tr.add(x.e)}if(x.st==='absent')o.a++;const l=lastRes(x);if(l){o.took++;if(l.passed)o.pass++}})});
 const sc=list.filter(r=>r.score!=null).map(r=>r.score);
 const row=(k,o)=>[k,o.emp,o.tr.size,o.emp?pctOf(o.tr.size,o.emp):null,o.emp?round1(o.h/o.emp):null,o.emp?Math.round(o.c/o.emp*100)/100:null,o.h?Math.round(o.c/o.h*100)/100:null,o.p+o.a?pctOf(o.p,o.p+o.a):null,o.took?pctOf(o.pass,o.took):null];
 const rows=Object.keys(by).sort().map(k=>row(k,by[k]));
 const all={emp:0,tr:new Set(),h:0,c:0,p:0,a:0,took:0,pass:0};Object.values(by).forEach(o=>{all.emp+=o.emp;o.tr.forEach(x=>all.tr.add(x+Math.random()));all.h+=o.h;all.c+=o.c;all.p+=o.p;all.a+=o.a;all.took+=o.took;all.pass+=o.pass});
 return{head:['Department','Employees','Trained','Coverage %','Hours per employee','Cost per employee','Cost per hour','Attendance %','Pass rate %'],rows:rows,tot:row('Totals',all),note:sc.length?t('Average participant feedback')+': '+round1(sc.reduce((a,b)=>a+b,0)/sc.length)+' / 5. '+t('Coverage = people who attended at least one training.'):t('Coverage = people who attended at least one training.'),list:list};
}

/* ===== v5.1: login lock countdown, recovery key, passcode history, Access panel, Excel import ===== */
const RK_CH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function genRk(){const a=new Uint32Array(12);(window.crypto&&crypto.getRandomValues?crypto.getRandomValues(a):a.forEach((_,i)=>a[i]=Math.random()*4e9));let s='';a.forEach((v,i)=>{s+=RK_CH[v%RK_CH.length];if(i%4===3&&i<11)s+='-'});return s}
const rkNorm=k=>String(k||'').replace(/[\s-]/g,'').toUpperCase();
function pwLogAdd(what){S.settings.pwLog=S.settings.pwLog||[];S.settings.pwLog.unshift({t:nowISO(),what:what});if(S.settings.pwLog.length>200)S.settings.pwLog.length=200}
function makeRecovery(){const k=genRk();const sl=uid();S.settings.recovery={salt:sl,hash:hashPw(rkNorm(k),sl),at:nowISO()};pwLogAdd('Recovery key made');return k}
function showRecovery(k,title){
 openModal('<h2 style="font-size:20px">'+esc(title||t('Your recovery key'))+'</h2><p class="muted small" style="margin:6px 0">'+esc(t('If you ever forget the Owner passcode, this key lets you set a new one. It is shown only now. Write it on paper or save it in a safe place. Anyone who has it can reset the passcode.'))+'</p><div class="card pad" style="text-align:center;font-size:24px;letter-spacing:.08em;font-family:ui-monospace,Menlo,monospace;font-weight:700;user-select:all">'+esc(k)+'</div><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn sec" data-act="rkcopy" data-k="'+esc(k)+'">'+esc(t('Copy'))+'</button><button class="btn" data-act="mclose">'+esc(t('I have saved it'))+'</button></div>',false)}
ACT.rkcopy=el=>{try{navigator.clipboard.writeText(el.dataset.k).then(()=>toast('ok',t('Copied.')),()=>toast('warn',t('Select the key and copy it by hand.')))}catch(e){toast('warn',t('Select the key and copy it by hand.'))}};
/* lock with visible countdown */
function lockLeft(){let u=owLockUntil;try{u=Math.max(u,+sessionStorage.getItem('sl.lk')||0)}catch(e){}return Math.max(0,Math.ceil((u-Date.now())/1000))}
function setLock(){owLockUntil=Date.now()+30000;try{sessionStorage.setItem('sl.lk',String(owLockUntil))}catch(e){}}
let lkTimer=null;
function lockUi(){
 clearInterval(lkTimer);
 const tick=()=>{const er=$('#lgErr'),er2=$('#recErr');const btns=document.querySelectorAll('#loginForm button[type=submit],[data-act=recgo]');
  if(!er){clearInterval(lkTimer);return}
  const s=lockLeft();
  if(s>0){const m=t('Too many wrong tries. Try again in {s} seconds.',{s:s});er.textContent=m;er.classList.add('on');if(er2){er2.textContent=m;er2.classList.add('on')}btns.forEach(b=>b.disabled=true)}
  else{clearInterval(lkTimer);er.classList.remove('on');er.textContent='';if(er2){er2.classList.remove('on');er2.textContent=''}btns.forEach(b=>b.disabled=false)}};
 tick();lkTimer=setInterval(tick,500)}
function failTry(er,msg){owFails++;if(owFails>=5){setLock();owFails=0;lockUi();return}er.textContent=msg+' ('+t('{n} tries left',{n:5-owFails})+')';er.classList.add('on')}
ACT.recshow=()=>{const b=$('#recBox');if(b)b.style.display=b.style.display==='none'?'flex':'none'};
ACT.recgo=()=>{
 const er=$('#recErr');er.classList.remove('on');
 if(lockLeft()>0){lockUi();return}
 const rc=S.settings.recovery;
 if(!rc){er.textContent=t('No recovery key was made in this browser. You can still restore a backup file (see the note below), or contact your developer.');er.classList.add('on');return}
 const p1=$('#lg_rp1').value,p2=$('#lg_rp2').value;
 if(hashPw(rkNorm($('#lg_rk').value),rc.salt)!==rc.hash){failTry(er,t('The recovery key is not right.'));logLogin('Owner','Owner',false,'wrong recovery key');return}
 if(p1.length<6){er.textContent=t('Use at least 6 characters');er.classList.add('on');return}
 if(p1!==p2){er.textContent=t('The two passcodes are different');er.classList.add('on');return}
 owFails=0;const sl=uid();S.settings.owner={salt:sl,hash:hashPw(p1,sl)};pwLogAdd('Owner passcode reset with the recovery key');
 const k=makeRecovery();logLogin('Owner','Owner',true,'passcode reset with recovery key');sessionSet({role:'owner',label:''});save();location.hash='#home';render();showRecovery(k,t('Passcode reset. Your new recovery key'))};
ACT.rknew=()=>{if(!isOwner())return;const e=$('#rkE');e.classList.remove('on');const o=S.settings.owner;if(hashPw($('#rk0').value,o.salt)!==o.hash){e.textContent=t('Current passcode is wrong');e.classList.add('on');return}
 const k=makeRecovery();logAct('Recovery key made');save();render();showRecovery(k)};

/* ---- Excel (.xlsx) reader: first sheet to CSV text ---- */
async function inflateRaw(u8){const ds=new DecompressionStream('deflate-raw');const w=ds.writable.getWriter();w.write(u8);w.close();return new Uint8Array(await new Response(ds.readable).arrayBuffer())}
async function zipRead(buf){
 const dv=new DataView(buf),u8=new Uint8Array(buf);let e=-1;
 for(let i=u8.length-22;i>=Math.max(0,u8.length-66000);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break}}
 if(e<0)throw new Error('not a zip');
 const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const out={};
 for(let k=0;k<n;k++){if(dv.getUint32(p,true)!==0x02014b50)break;
  const meth=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);
  const name=new TextDecoder().decode(u8.subarray(p+46,p+46+nl));p+=46+nl+el+cl;
  if(!/^xl\/(workbook\.xml|_rels\/workbook\.xml\.rels|sharedStrings\.xml|worksheets\/[^/]+\.xml)$/.test(name))continue;
  const ln=dv.getUint16(off+26,true),le=dv.getUint16(off+28,true),ds=off+30+ln+le;const raw=u8.subarray(ds,ds+cs);
  out[name]=new TextDecoder().decode(meth===0?raw:await inflateRaw(raw))}
 return out}
const colIdx=r=>{const m=/^([A-Z]+)/.exec(r||'');if(!m)return 0;let n=0;for(const c of m[1])n=n*26+c.charCodeAt(0)-64;return n-1};
function xlDate(v){const d=new Date(Math.round((v-25569)*86400000));return d.toISOString().slice(0,10)}
function xlTime(v){const m=Math.round((v%1)*1440);return String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
async function xlsxToCsv(buf){
 const z=await zipRead(buf);const P=s=>new DOMParser().parseFromString(s,'application/xml');
 let path=null;
 if(z['xl/workbook.xml']&&z['xl/_rels/workbook.xml.rels']){const wb=P(z['xl/workbook.xml']),rl=P(z['xl/_rels/workbook.xml.rels']);const sh=wb.getElementsByTagName('sheet')[0];
  if(sh){const rid=sh.getAttribute('r:id')||sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');for(const r of rl.getElementsByTagName('Relationship')){if(r.getAttribute('Id')===rid){let tg=r.getAttribute('Target');tg=tg.replace(/^\//,'').replace(/^xl\//,'');path='xl/'+tg}}}}
 if(!path||!z[path])path=Object.keys(z).filter(k=>/worksheets\//.test(k)).sort()[0];
 if(!path)throw new Error('no sheet');
 const ss=[];if(z['xl/sharedStrings.xml']){for(const si of P(z['xl/sharedStrings.xml']).getElementsByTagName('si')){ss.push([...si.getElementsByTagName('t')].map(x=>x.textContent).join(''))}}
 const rows=[];
 for(const row of P(z[path]).getElementsByTagName('row')){const r=[];
  for(const c of row.getElementsByTagName('c')){const i=colIdx(c.getAttribute('r'));const ty=c.getAttribute('t');const v=c.getElementsByTagName('v')[0];let s='';
   if(ty==='s'&&v)s=ss[+v.textContent]||'';else if(ty==='inlineStr')s=[...c.getElementsByTagName('t')].map(x=>x.textContent).join('');else if(v)s=v.textContent;
   while(r.length<i)r.push('');r[i]=s}
  if(r.some(x=>String(x).trim()!==''))rows.push(r)}
 if(!rows.length)return '';
 const hd=rows[0].map(h=>String(h).toLowerCase());
 for(let ri=1;ri<rows.length;ri++){rows[ri]=rows[ri].map((v,ci)=>{const h=hd[ci]||'';if(v!==''&&/^-?\d+(\.\d+)?$/.test(String(v).trim())){const x=+v;
   if(/date/.test(h)&&x>20000&&x<80000)return xlDate(x);if(/(^|\s)(time|from|to)(\s|$)|time/.test(h)&&x>=0&&x<1&&x!==0)return xlTime(x);if(/date/.test(h)&&x>20000)return xlDate(x)}return v})}
 return rows.map(r=>{const w=Math.max(...rows.map(q=>q.length));const a=r.slice();while(a.length<w)a.push('');return a.map(csvCell).join(',')}).join('\r\n')}
